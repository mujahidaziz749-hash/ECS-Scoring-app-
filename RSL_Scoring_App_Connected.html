<style>

.c7{background:linear-gradient(135deg,#55b83f,#1d5a14)}.c8{background:linear-gradient(135deg,#d4a72a,#5c4608)}.c9{background:linear-gradient(135deg,#e84ca0,#6e1650)}.c10{background:linear-gradient(135deg,#1fb0d4,#0c3f55)}

.dots .w1{background:var(--r);border-color:var(--r);color:#fff}.dots .x{border-color:var(--g);color:var(--g)}

.light .rb{background:#f2faf8;color:#173731;border-color:#cfe6df}.light .rb.f{color:#8a6a1c;border-color:#e6c874}.light .dots span{background:#f2faf8;color:#173731}.light .dots .w1{background:#fdeaea;color:#a31d1d;border-color:#e79a9a}.light .dots .x{background:#fdf3da;color:#8a6a1c;border-color:#e6c874}
.light .win{color:#a05a00}.light .chip{background:#eef7f4;color:#173731}
.mlb{display:block;width:100%;text-align:left;padding:15px 14px;border:0;border-bottom:1px solid var(--b);background:transparent;color:var(--t);font:600 1rem Poppins,system-ui;cursor:pointer}
.choice-btn{display:block;width:100%;text-align:left;padding:14px;margin:7px 0;border-radius:10px;border:1px solid var(--b);background:var(--p2);color:var(--t);font:700 1.02rem Poppins,system-ui;cursor:pointer}
.rb{height:48px!important;font-size:1.05rem!important}.xb{padding:10px 2px!important;font-size:.8rem!important;line-height:1.15;margin:0!important;border-radius:12px!important}
.strip{display:flex;gap:8px;flex-wrap:wrap}.strip>div{flex:1;min-width:120px;border:1px solid var(--b);border-radius:10px;padding:8px 10px}.strip b{display:block;font-size:1.05rem}
tr.unp td:nth-child(2){color:#ff8f8f;font-weight:700}
.lt{font-size:1.02rem}.lt th{font-size:.92rem;color:var(--m);text-align:right;padding:8px 6px;border-bottom:2px solid var(--b);font-weight:600}.lt td{padding:13px 6px;text-align:right;border-bottom:1px solid var(--b);font-weight:600}.lt td:first-child,.lt th:first-child{text-align:left}.lt td:first-child{font-weight:700}
.rkb{flex:0 0 36px;width:36px;height:36px;border-radius:50%;background:var(--p2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.lbv{flex:0 0 auto;font:800 1.3rem Poppins,sans-serif;color:var(--g);text-align:right;min-width:52px}
.lbr{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:7px 0}
.lt tr.stk td{background:#fff0bd!important;color:#3d2c00!important}.lt tr.nst td{background:#d9ecff!important;color:#0d2f52!important}.lt tr.stk td:first-child{border-left:6px solid #e8a400}.lt tr.nst td:first-child{border-left:6px solid #2d7ff9}.lt tr.stk td,.lt tr.nst td{padding:10px 6px}.stheme{border-radius:14px;padding:10px;color:var(--t)}.stheme .lt tr.stk td{background:var(--sk)!important;color:var(--skt)!important}.stheme .lt tr.nst td{background:var(--nk)!important;color:var(--nkt)!important}.stheme .win{color:var(--g)}.lt tr.stk td,.lt tr.nst td,.stheme .lt tr.stk td,.stheme .lt tr.nst td,.lt tr.stk td:first-child,.lt tr.nst td:first-child{background:transparent!important;color:inherit!important;border-left:0!important}</style></head><body><div class="w" id="app"></div>
<script>
const K='rsl_v1';
const init=()=>({teams:[],tours:[],series:[],matches:[],entries:[],expenses:[],fees:{},rules:[],grounds:[],cur:null,reg:[],pl:[]});
let db;try{db=Object.assign(init(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(x){db=init()}
db.gone=db.gone||{};let view='home',ctx={};
/* ===== Cloud sync (Firebase Realtime Database REST + per-admin login) ===== */
const CK='rsl_cloud',AK='rsl_admin';let CL=null,AD=null;try{CL=JSON.parse(localStorage.getItem(CK)||'null')}catch(x){}try{AD=JSON.parse(localStorage.getItem(AK)||'null')}catch(x){}
/* Pre-connected build: yahan cloud code ka decoded data daalne se ye file kholte hi khud connect (viewer) ho jati hai. Format: {url:'https://..firebaseio.com',club:'RSL',key:'AIza...'} */
const DEFAULT_CLOUD={url:'https://rsl-season-2-604aa-default-rtdb.firebaseio.com',club:'RSL',key:'AIzaSyArPat7DxN9U1zWhnp6RlshsaCWqvGgPA0'};
try{if(!CL&&DEFAULT_CLOUD&&!localStorage.getItem('rsl_cloud_off')){CL=Object.assign({},DEFAULT_CLOUD);localStorage.setItem(CK,JSON.stringify(CL))}}catch(x){}
const clUrl=()=>CL?CL.url.replace(/\/+$/,'')+'/rsl/'+encodeURIComponent(CL.club)+'.json':'';
const isAdm=()=>!!(CL&&CL.key&&AD&&AD.rt);
let clT=null,clSt=CL?'Connected':'Off',clBusy=false,_tok=null,_tokExp=0;
const _lsave=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(x){}};
let _cs='';const save=()=>{if(CL&&!isAdm())return;db._ts=Date.now();_lsave();clSched()};
function clUp(){const o=document.getElementById('clst');if(o)o.textContent=clSt;clBadge()}
function clBadge(){let b=document.getElementById('clbd');if(!CL){if(b)b.remove();return}if(!b){b=document.createElement('div');b.id='clbd';b.style.cssText='position:fixed;top:6px;right:6px;z-index:60;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;pointer-events:none;opacity:.92';document.body.appendChild(b)}const ad=isAdm();b.textContent=ad?'☁ Admin':'👁 Viewer';b.style.background=ad?'#0a6b3f':'#5b4a00';b.style.color='#fff'}
async function clToken(){if(_tok&&Date.now()<_tokExp-60000)return _tok;const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(CL.key),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(AD.rt)});if(!r.ok){const er=new Error('auth');er.auth=1;throw er}const j=await r.json();_tok=j.id_token;_tokExp=Date.now()+(+j.expires_in||3600)*1000;if(j.refresh_token&&j.refresh_token!==AD.rt){AD.rt=j.refresh_token;try{localStorage.setItem(AK,JSON.stringify(AD))}catch(x){}}return _tok}
function clSched(){if(!CL)return;clearTimeout(clT);clT=null;if(!isAdm()){clSt='👁 Viewer - badlao cloud par save nahi hote';clUp();return}clSt='⏳ Sync hone wala hai…';clUp();clT=setTimeout(clPush,1500)}
async function clPush(){clT=null;if(!isAdm())return;try{const t=await clToken();const r=await fetch(clUrl()+'?auth='+encodeURIComponent(t),{method:'PUT',body:JSON.stringify({ts:db._ts||Date.now(),data:JSON.stringify(db)})});if(r.status===401||r.status===403){clSt='⛔ Is account ko likhne ka haq nahi (admin list mein nahi)';clUp();return}if(!r.ok)throw new Error(r.status);clSt='✅ Cloud par save ('+new Date().toLocaleTimeString()+')'}catch(x){if(x.auth){clSt='⛔ Admin login expire - dobara login karo';clUp();return}clSt='⚠ Internet/Cloud masla - baad mein khud sync hoga';clT=setTimeout(clPush,20000)}clUp()}
function clApply(j){db=Object.assign(init(),JSON.parse(j.data));db.gone=db.gone||{};db._ts=j.ts;try{fixTeams();fixRules();regSync()}catch(x){}_lsave();_cs=JSON.stringify(db)}
async function clPull(manual){if(!CL||clBusy)return;clBusy=true;try{const r=await fetch(clUrl());if(!r.ok)throw new Error(r.status);const j=await r.json();const adm=isAdm();
 if(!j||!j.data){if(adm){await clPush();if(manual)toast('☁ Cloud khali tha - is device ka data upload ho gaya')}else{clSt='👁 Cloud abhi khali hai (admin ne data upload nahi kiya)'}}
 else if(adm?j.ts>(db._ts||0):j.ts!==db._ts){if(view==='play'&&!manual){clSt='☁ Naya data hai - match ke baad update hoga'}else{clApply(j);clSt=(adm?'✅ Cloud se update (':'👁 Latest data (')+new Date().toLocaleTimeString()+')';if(adm||manual)toast('☁ Cloud se naya data aa gaya');go(view==='data'?'data':'home')}}
 else if(!adm&&JSON.stringify(db)!==_cs){clApply(j);clSt='👁 Latest data ('+new Date().toLocaleTimeString()+')'}
 else if(adm&&j.ts<(db._ts||0)){await clPush()}
 else{clSt=(adm?'✅ Sab sync hai (':'👁 Sab latest hai (')+new Date().toLocaleTimeString()+')';if(manual)toast('☁ Sab sync hai')}
}catch(x){clSt='⚠ Cloud tak nahi pahunch saka (internet / URL check karo)';if(manual)toast(clSt,false)}clBusy=false;clUp()}
function clCard(){const ad=isAdm();return `<div class="card"><h3 style="margin-top:0">☁ Cloud Sync</h3><div class="m">Data online save hota hai aur kisi bhi device par khul jata hai. <b>Admin</b> badal sakte hain, baaqi sab sirf <b>dekh</b> sakte hain.</div><div class="m" style="margin:6px 0"><b>Status:</b> <span id="clst">${e(clSt)}</span>${CL?'<br><b>Club:</b> '+e(CL.club)+'<br><b>Role:</b> '+(ad?'🟢 Admin ('+e(AD.email)+')':'🟡 Viewer (sirf dekhna)'):''}</div>${CL?(ad?'<button class="b s" data-a="cao">🚪 Admin logout</button>':'<button class="b g" data-a="cal">🔐 Admin login</button>')+'<button class="b s" data-a="csync">🔄 Abhi sync karo</button><button class="b s" data-a="cshare">📋 Cloud code copy (doosre device ke liye)</button><button class="b s" data-a="coff">⏏ Cloud band karo</button>':'<button class="b g" data-a="cset">☁ Cloud connect karo</button>'}</div>`}
function clConnect(url,club,key){url=(url||'').trim();club=(club||'').trim().replace(/[^\w-]/g,'');key=(key||'').trim();if(!/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)\/?$/.test(url))return msgBox('Database URL sahi nahi. Jaise:\nhttps://mera-app-default-rtdb.firebaseio.com');if(!club)return msgBox('Club code likho (jaise RSL).');
 const nc={url:url.replace(/\/+$/,''),club,key};const old=CL;CL=nc;fetch(clUrl()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{
  const fin=()=>{try{localStorage.setItem(CK,JSON.stringify(CL));localStorage.removeItem('rsl_cloud_off')}catch(x){}AD=null;try{localStorage.removeItem(AK)}catch(x){}_tok=null;clSt='✅ Connected (viewer)';go('data');toast('☁ Connected - abhi aap viewer hain. Badalne ke liye Admin login karo.')};
  if(j&&j.data){const has=db.teams.length||db.matches.length||db.pl.length||db.tours.length;
   if(has){cf('Cloud par data mojood hai.\n\nHaan = Cloud ka data aa jaye (is device ka data replace hoga)\nNahi = connection cancel',()=>{clApply(j);fin()});const n=[...document.querySelectorAll('.ov')].pop().querySelector('#dn');n.onclick=()=>{n.closest('.ov').remove();CL=old}}
   else{clApply(j);fin()}}
  else fin()
 }).catch(x=>{CL=old;msgBox('Cloud se connect nahi hua.\n\n• URL check karo\n• Rules mein ".read": true hona chahiye\n• Internet on ho')})}
async function clLogin(email,pw){if(!CL||!CL.key)return msgBox('Is Cloud code mein Web API key nahi hai. Admin se poora code maango.');try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(CL.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.trim().toLowerCase(),password:pw,returnSecureToken:true})});const j=await r.json();if(!r.ok||!j.idToken)return msgBox('Login nahi hua: '+((j.error&&j.error.message)||r.status).replace(/_/g,' ')+'\n\nEmail/password check karo.');
 AD={email:j.email,rt:j.refreshToken};_tok=j.idToken;_tokExp=Date.now()+(+j.expiresIn||3600)*1000;try{localStorage.setItem(AK,JSON.stringify(AD))}catch(x){}clSt='✅ Admin login ho gaya';toast('🔐 Admin login ho gaya');await clPull(true);go('data')}catch(x){msgBox('Internet ka masla - login nahi ho saka.')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=i=>db.teams.find(t=>t.id===i)||{name:'?',color:'#888',players:[]};
const PN=(t,p)=>{let x=T(t).players.find(z=>z.id===p);if(!x)for(const q of db.teams){x=q.players.find(z=>z.id===p);if(x)break}return x?x.name:((db.gone||{})[p]||'?')};
const _hx=c=>/^#[0-9a-fA-F]{6}$/.test(c)?c:'#888888';
const lumC=c=>{c=_hx(c);return(0.299*parseInt(c.substr(1,2),16)+0.587*parseInt(c.substr(3,2),16)+0.114*parseInt(c.substr(5,2),16))/255};
const mixC=(c,t,a)=>{c=_hx(c);const f=i=>Math.round(parseInt(c.substr(i,2),16)*(1-a)+t*a).toString(16).padStart(2,'0');return '#'+f(1)+f(3)+f(5)};
const tcol=(c,light)=>{const L=lumC(c);return light?(L>0.45?mixC(c,0,.5):_hx(c)):(L<0.3?mixC(c,255,.45):_hx(c))};

function _u8ToLatin1(u8){ let s=""; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return s; }
function _latin1ToU8(s){ const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; }

function embedJsonInPdfBytes(pdfU8, payloadObj, fileName){
  fileName = fileName || "cricket_data.json";
  const pdf = _u8ToLatin1(pdfU8);
  const sx = pdf.lastIndexOf("startxref");
  const tr = pdf.lastIndexOf("trailer", sx);
  if(sx<0 || tr<0) throw new Error("PDF structure samajh nahi aayi");
  const prevXref = parseInt(pdf.slice(sx+9).trim(),10);
  const trailer = pdf.slice(tr, sx);
  const size = parseInt(/\/Size\s+(\d+)/.exec(trailer)[1],10);
  const rootNum = parseInt(/\/Root\s+(\d+)\s+0\s+R/.exec(trailer)[1],10);
  const infoM = /\/Info\s+\d+\s+0\s+R/.exec(trailer);
  const idM = /\/ID\s*\[[^\]]*\]/.exec(trailer);
  const rootRe = new RegExp("(?:^|[\\r\\n])"+rootNum+"\\s+0\\s+obj([\\s\\S]*?)endobj");
  const rm = rootRe.exec(pdf);
  if(!rm) throw new Error("PDF catalog nahi mila");
  const cat = rm[1];
  const closeIdx = cat.lastIndexOf(">>");
  if(closeIdx<0 || /\/Names\b/.test(cat)) throw new Error("PDF catalog is tarah nahi jor sakte");

  const b64 = _u8ToLatin1(new TextEncoder().encode(JSON.stringify(payloadObj))); // raw UTF-8 JSON bytes (attachment khud ek valid .json file hai)
  const A = size, B = size+1;
  const newCat = rootNum+" 0 obj"+cat.slice(0,closeIdx)+
    "/Names << /EmbeddedFiles << /Names [("+fileName+") "+B+" 0 R] >> >>\n/AF ["+B+" 0 R]\n"+cat.slice(closeIdx)+"endobj\n";
  const streamObj = A+" 0 obj\n<< /Type /EmbeddedFile /Subtype /application#2Fjson /CricketBackup 1 /Length "+b64.length+" >>\nstream\n"+b64+"\nendstream\nendobj\n";
  const specObj = B+" 0 obj\n<< /Type /Filespec /F ("+fileName+") /UF ("+fileName+") /Desc (Evening Cricket Series Manager app data) /AFRelationship /Data /EF << /F "+A+" 0 R >> >>\nendobj\n";

  let out = pdf; if(!/\n$/.test(out)) out += "\n";
  const off = {};
  off[rootNum] = out.length; out += newCat;
  off[A] = out.length; out += streamObj;
  off[B] = out.length; out += specObj;
  const pad = n => ("0000000000"+n).slice(-10);
  const xrefPos = out.length;
  out += "xref\n"+rootNum+" 1\n"+pad(off[rootNum])+" 00000 n \n"+A+" 2\n"+pad(off[A])+" 00000 n \n"+pad(off[B])+" 00000 n \n";
  out += "trailer\n<< /Size "+(size+2)+" /Root "+rootNum+" 0 R /Prev "+prevXref+(infoM?" "+infoM[0]:"")+(idM?" "+idM[0]:"")+" >>\nstartxref\n"+xrefPos+"\n%%EOF\n";
  return _latin1ToU8(out);
}

function extractJsonFromPdfBytes(u8){
  const s = _u8ToLatin1(u8);
  const key = "/CricketBackup 1 /Length ";
  const at = s.lastIndexOf(key);
  if(at<0) return null;
  const m = /^(\d+) >>\s*stream\r?\n/.exec(s.slice(at+key.length, at+key.length+60));
  if(!m) return null;
  const start = at+key.length+m[0].length;
  const raw = s.slice(start, start+parseInt(m[1],10));
  return JSON.parse(new TextDecoder().decode(_latin1ToU8(raw)));
}

function savePdfWithData(doc, filename, payload){
  try{
    const bytes = embedJsonInPdfBytes(new Uint8Array(doc.output('arraybuffer')), payload);
    const blob = new Blob([bytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    console.error(e);
    doc.save(filename);
    msgBox("PDF ban gayi, lekin usme app ka data attach nahi ho saka — is PDF se import nahi hoga. JSON export use karein.");
  }
}
